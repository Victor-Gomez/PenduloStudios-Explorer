name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 06:00 UTC to verify against current runners and dependencies
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc libfontconfig1 fonts-dejavu-core

      - name: Restore dependencies
        run: dotnet restore RunawayExplorer.slnx

      - name: Build solution
        run: dotnet build RunawayExplorer.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test RunawayExplorer.slnx -c Release --no-build --verbosity normal --logger "console;verbosity=detailed"
